# =============================================================================
#  experiment_v2.yaml  -  VERSION 2 del experimento
#
#  Se mezcla encima de config/experiment.yaml (solo cambia lo que aparece aqui):
#      python run_all.py --config config/experiment_v2.yaml
#
#  Usa el dataset "Ton-IoT-v2" del preprocessor (preprocessor/config.json), que:
#    * elimina flujos repetidos y ambiguos ANTES de partir en train/test, para que
#      una copia del mismo flujo no quede en entrenamiento y en prueba;
#    * parte 80/20 estratificado por tipo de ataque;
#    * aplica log(1+x) a bytes, paquetes y duracion antes de MinMax;
#    * arma el one-hot con TODAS las categorias del train (no solo 10 000 filas);
#    * trata como identificadores (no variables) los campos de texto propios del
#      entorno de captura: dns_query, http_uri, http_user_agent, ssl_subject, ssl_issuer.
#
#  Todo lo demas (variables, umbral, espacios de busqueda, trials, semillas, limites
#  del borde) es IGUAL a la version 1, para que la comparacion sea limpia.
#  La version 1 sigue en data/splits y outputs/; la 2 escribe en data/splits_v2 y outputs_v2.
# =============================================================================

paths:
  splits_dir: data/splits_v2
  outputs_dir: outputs_v2

dataset:
  name: Ton-IoT-v2
